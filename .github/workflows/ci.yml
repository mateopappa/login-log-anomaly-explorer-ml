name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (dev, ml, dashboard extras)
        run: python -m pip install -e ".[dev,ml,dashboard]"
      - name: Test
        run: python -m pytest -v
