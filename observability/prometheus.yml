global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: pipeline-worker
    static_configs:
      - targets: ["pipeline-worker:9100"]
        labels:
          service: login-anomaly-worker

  - job_name: pipeline-producer
    static_configs:
      - targets: ["pipeline-producer:9101"]
        labels:
          service: login-anomaly-producer
