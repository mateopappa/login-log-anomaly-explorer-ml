[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "login-anomaly"
version = "0.1.0"
description = "Login-log anomaly explorer: synthetic generator, rule and ML detectors, evaluation."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# ml: the supervised baseline (Phase D). Kept optional so the generator and the rule
# detector install with no third-party runtime dependencies.
ml = ["scikit-learn>=1.4"]
# dashboard: the local Streamlit app only. Business logic does not depend on it.
dashboard = ["streamlit>=1.36"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
